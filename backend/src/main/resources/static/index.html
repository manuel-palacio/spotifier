<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotifier</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1db954">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spotifier">
<style>
  :root {
    --bg: #f5f5f2; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --border: #dcdcd6; --accent: #1db954; --accent-text: #ffffff; --error: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1e1e1e; --text: #f0f0f0; --muted: #a0a0a0;
      --border: #333333; --accent: #1ed760; --accent-text: #0b0b0b; --error: #ff6b5b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 480px; }
  h1 { margin: 0 0 4px; font-size: 1.75rem; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    width: 100%; padding: 14px; font-size: 1rem; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, .button {
    display: inline-flex; justify-content: center; align-items: center; padding: 14px 18px;
    font-size: 1rem; font-weight: 600; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; text-decoration: none;
  }
  button.primary, .button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.6; cursor: progress; }
  #status { min-height: 1.5em; margin: 16px 0 0; color: var(--muted); }
  #status.error { color: var(--error); }
  #result {
    margin-top: 8px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  }
  #result-link { display: block; margin-bottom: 12px; color: var(--text); word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions > * { flex: 1 1 auto; }
</style>
</head>
<body>
<main>
  <h1>Spotifier</h1>
  <p class="lead">Paste a YouTube Music link or video ID to get the Spotify link.</p>

  <form id="lookup-form">
    <input id="video-input" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="https://music.youtube.com/watch?v=…" aria-label="YouTube Music link or video ID" required>
    <button id="submit-button" class="primary" type="submit">Find on Spotify</button>
  </form>

  <p id="status" role="status"></p>

  <section id="result" hidden>
    <a id="result-link" target="_blank" rel="noopener"></a>
    <div class="actions">
      <button id="copy-button" type="button">Copy</button>
      <button id="share-button" type="button" hidden>Share</button>
      <a id="open-button" class="button primary" target="_blank" rel="noopener">Open in Spotify</a>
    </div>
  </section>
</main>

<script>
  const VIDEO_ID_PATTERN = /^[A-Za-z0-9_-]{11}$/;
  const ERROR_MESSAGES = {
    400: "That doesn't look like a valid video ID.",
    404: "Song not found on Spotify.",
    429: "Too many lookups right now — wait a minute and try again.",
  };

  const form = document.getElementById("lookup-form");
  const input = document.getElementById("video-input");
  const submitButton = document.getElementById("submit-button");
  const statusText = document.getElementById("status");
  const result = document.getElementById("result");
  const resultLink = document.getElementById("result-link");
  const copyButton = document.getElementById("copy-button");
  const shareButton = document.getElementById("share-button");
  const openButton = document.getElementById("open-button");

  form.addEventListener("submit", event => {
    event.preventDefault();
    findSpotifyLink(input.value.trim());
  });
  copyButton.addEventListener("click", copyLink);
  shareButton.addEventListener("click", () => navigator.share({ url: resultLink.href }));
  shareButton.hidden = !navigator.share;
  navigator.serviceWorker?.register("/sw.js");
  lookUpSharedLink();

  function lookUpSharedLink() {
    const params = new URLSearchParams(location.search);
    const sharedText = ["url", "text", "title"].map(name => params.get(name) ?? "").join(" ");
    const sharedLink = sharedText.match(/https?:\/\/\S+/)?.[0];
    if (!sharedLink) return;
    history.replaceState(null, "", "/");
    input.value = sharedLink;
    findSpotifyLink(sharedLink);
  }

  async function findSpotifyLink(userInput) {
    const videoId = extractVideoId(userInput);
    if (!videoId) {
      showError("Paste a YouTube Music link or an 11-character video ID.");
      return;
    }
    showLoading();
    try {
      const response = await fetch(`/spotifier?videoId=${encodeURIComponent(videoId)}`);
      if (!response.ok) {
        showError(ERROR_MESSAGES[response.status] ?? "Could not look up the song — try again.");
        return;
      }
      showResult(await response.text());
    } catch {
      showError("Could not reach the server — try again.");
    } finally {
      submitButton.disabled = false;
    }
  }

  function extractVideoId(userInput) {
    if (VIDEO_ID_PATTERN.test(userInput)) return userInput;
    try {
      const url = new URL(userInput);
      const videoId = url.hostname === "youtu.be" ? url.pathname.slice(1) : url.searchParams.get("v");
      return VIDEO_ID_PATTERN.test(videoId ?? "") ? videoId : null;
    } catch {
      return null;
    }
  }

  function showLoading() {
    submitButton.disabled = true;
    result.hidden = true;
    setStatus("Looking up… (the first request can take a few seconds)", false);
  }

  function showResult(spotifyUrl) {
    resultLink.href = openButton.href = spotifyUrl;
    resultLink.textContent = spotifyUrl;
    result.hidden = false;
    setStatus("", false);
  }

  function showError(message) {
    result.hidden = true;
    setStatus(message, true);
  }

  function setStatus(message, isError) {
    statusText.textContent = message;
    statusText.classList.toggle("error", isError);
  }

  async function copyLink() {
    await navigator.clipboard.writeText(resultLink.href);
    copyButton.textContent = "Copied!";
    setTimeout(() => copyButton.textContent = "Copy", 1500);
  }
</script>
</body>
</html>
